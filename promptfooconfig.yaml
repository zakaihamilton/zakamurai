# promptfoo configuration
# Static architectural compliance checks (echo provider — no API keys required).

prompts:
  - label: static-validation
    raw: file://tests/ai-golden/prompt.txt

providers:
  - echo

tests:
  - description: "CSS Modules and Styling Compliance"
    vars: file://tests/ai-golden/vars-good-css-module.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertCssModules

  - description: "State Proxy Architecture Compliance"
    vars: file://tests/ai-golden/vars-good-state-proxy.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertStateProxy

  - description: "SEARCH/REPLACE Block Format Integrity"
    vars: file://tests/ai-golden/vars-valid-diff.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertSearchReplace

  - description: "Golden — valid SEARCH/REPLACE fixture"
    vars: file://tests/ai-golden/vars-valid-diff.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertValidGoldenDiff

  - description: "Golden — malformed diff fixture fails markers check"
    vars: file://tests/ai-golden/vars-malformed-diff.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertMalformedGoldenDiff

  - description: "Golden — unsafe path fixture"
    vars: file://tests/ai-golden/vars-unsafe-paths.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertUnsafePaths

  - description: "Golden — Tailwind violation fixture"
    vars: file://tests/ai-golden/vars-tailwind-violation.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertTailwindViolation

  - description: "Golden — inline style violation fixture"
    vars: file://tests/ai-golden/vars-inline-style-violation.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertInlineStyleViolation

  - description: "Golden — domain useState violation fixture"
    vars: file://tests/ai-golden/vars-domain-usestate-violation.json
    assert:
      - type: javascript
        value: file://scripts/promptfoo-assertions.ts:assertDomainUseStateViolation
