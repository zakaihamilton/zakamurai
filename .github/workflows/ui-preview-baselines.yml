name: Generate UI preview Linux baselines
on:
  workflow_dispatch:
  push:
    branches: [codex/ui-preview-linux-baselines]
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run setup:almostnode && pnpm run setup:wasm
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify checked-in preview baselines
        run: pnpm exec playwright test tests/visual/ui-preview.spec.ts --workers=1
