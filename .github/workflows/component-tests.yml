name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Repository health
        run: npm run health

      - name: Prepare browser build assets
        run: npm run setup:almostnode && npm run setup:wasm

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Check formatting, linting, and styles
        run: npm run format:check && npm run lint && npm run stylelint

      - name: Check unused dependencies and files
        run: npm run deadcode

      - name: Check architecture rules
        run: npm run check:architecture

      - name: Run static AI compliance eval
        run: npm run test:promptfoo

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build production app and check performance budgets
        run: npm run build && npm run perf && npm run check:runtime-assets && npm run test:performance

      - name: Run Chromium and WebKit end-to-end tests
        run: npm run test:e2e && npm run test:e2e:webkit

      - name: Run isolated preview security tests in Chromium and WebKit
        run: npm run test:e2e:isolated && npm run test:e2e:isolated:webkit

      - name: Check production preview surface headers
        run: npm run check:preview

      - name: Run Chromium and WebKit visual/accessibility regression tests
        run: npm run test:visual

      - name: Audit production dependencies
        run: npm run audit

      - name: Upload coverage and Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-artifacts
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  node-25-compatibility:
    name: Node 25 compatibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare browser build assets
        run: npm run setup:almostnode && npm run setup:wasm

      - name: Run Node 25 compatibility smoke checks
        run: npm run lint && npm run typecheck && npm run test:unit && npm run build && npm run perf && npm run check:runtime-assets
