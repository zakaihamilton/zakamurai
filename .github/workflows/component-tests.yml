name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Repository health
        run: pnpm run health

      - name: Prepare browser build assets
        run: pnpm run setup:almostnode && pnpm run setup:wasm

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Check formatting, linting, types, and styles
        run: pnpm run format:check && pnpm run lint && pnpm run stylelint && pnpm run typecheck

      - name: Check unused dependencies and files
        run: pnpm run deadcode

      - name: Check architecture rules
        run: pnpm run check:architecture

      - name: Run static AI compliance eval
        run: pnpm run test:promptfoo && pnpm run test:ai-evals

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Build production app and check performance budgets
        run: pnpm run build && pnpm run perf && pnpm run check:runtime-assets && pnpm run test:performance

      - name: Run Chromium and WebKit end-to-end tests
        run: pnpm run test:e2e && pnpm run test:e2e:webkit

      - name: Run isolated preview security tests in Chromium and WebKit
        run: pnpm run test:e2e:isolated && pnpm run test:e2e:isolated:webkit

      - name: Check production preview surface headers
        run: pnpm run check:preview

      - name: Run Chromium and WebKit visual/accessibility regression tests
        run: pnpm run test:visual

      - name: Audit production dependencies
        run: pnpm run audit

      - name: Upload coverage and Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-artifacts
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  node-25-compatibility:
    name: Node 25 compatibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare browser build assets
        run: pnpm run setup:almostnode && pnpm run setup:wasm

      - name: Run Node 25 compatibility smoke checks
        run: pnpm run lint && pnpm run typecheck && pnpm run test:unit && pnpm run build && pnpm run perf && pnpm run check:runtime-assets
