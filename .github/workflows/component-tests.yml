name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare browser build assets
        run: npm run setup:almostnode && npm run setup:wasm

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Check formatting, linting, and styles
        run: npm run format:check && npm run lint && npm run stylelint

      - name: Check unused dependencies and files
        run: npm run deadcode

      - name: Check architecture rules
        run: npm run check:architecture

      - name: Run static AI compliance eval
        run: npm run test:promptfoo

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build production app and check asset budget
        run: npm run build && npm run perf

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e

      - name: Run isolated preview security tests
        run: npm run test:e2e:isolated

      - name: Check production preview surface headers
        run: npm run check:preview

      - name: Run Chromium visual regression tests
        run: npm run test:visual:chromium

      - name: Audit production dependencies
        run: npm run audit

      - name: Upload coverage and Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-artifacts
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
